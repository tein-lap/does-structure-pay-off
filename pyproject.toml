[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dspo"
version = "0.1.0"
description = "Does Structure Pay Off? Code-graph navigation for small SWE agents under a tool-call budget"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["networkx>=3.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["dspo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
