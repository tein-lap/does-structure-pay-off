# Generation settings shared by every arm (inlined into agent.yaml by make_configs.py).
# HARNESS_README 2.4: thinking is ON only with include_thoughts: true and thinking_budget > 0
# ("use 0 or include_thoughts: false to disable thinking"). We keep a small budget: the
# context is 32,768 tokens (compacted at 14,336) and every task has only a few minutes.
temperature: 0.2
top_p: 0.95
seed: 0
max_output_tokens: 2048
thinking_config:
  thinking_budget: 512
  include_thoughts: true
