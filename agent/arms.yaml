# Tool sets for the four ablation arms (paper Section 3.2) and the bridge configs (Section 3.3).
#
# Tool names are the 9 built-in tools from HARNESS_README section 6. There is no
# separate grep tool: searching (grep, find, ls) and running tests both use
# run_command. Every arm shares the same model, prompt, editing and testing tools;
# only the GRAPH tools change.

shared_tools:            # in every arm: needed to search, read, edit, test and submit
  - run_command          # counts toward the budget
  - read_file            # counts toward the budget (max 150 lines / 10,000 chars per call)
  - edit_file            # counts toward the budget
  - write_file           # counts toward the budget
  - submit_patch         # free
  - get_status           # free

exploration:
  base: []                                      # nothing beyond the shared tools
  graph: [get_code_neighbors, get_code_subgraph]
  embedding: [search_similar_code]

arms:
  A: [base]                          # run_command + read_file only
  B: [base, graph]                   # + neighbours/subgraph, no embedding search
  C: [base, embedding]               # + embedding search, no graph tools
  D: [base, graph, embedding]        # everything

# Bridge configurations: an arm plus the issue-to-symbol skill (declared under
# `skills:` in agent.yaml, not under `tools:`). Set best_arm after Part 2.
best_arm: D
bridge_skill: skills/issue_to_symbols
bridge_configs:
  B+bridge: B                        # the bridge seeds the call-graph tools; B has only safe tools
  D+bridge: D                        # blocked while search_similar_code is blocked (see below)

# Tools whose output can be larger than the model's whole context. search_similar_code returns
# the FULL source of every result with no documented size cap (HARNESS_README 6.3; the 5,000 and
# 10,000-character caps cover only run_command and read_file). Measured on the public upstream
# repos: fastapi.applications.FastAPI is ~46,000 tokens and fastapi.routing.APIRouter ~41,000,
# more than the 32,768-token context, so one result can make the next model call impossible.
# Arm C (the only arm whose single new tool is this one) failed twice with "Kaggle Error" on
# 2026-10-06/07, while A and B succeeded. Arms using a blocked tool are not built unless
# make_configs.py is run with --allow-blocked.
blocked_tools: [search_similar_code]

# Written to eval_config.yaml (evaluation.max_tool_calls) next to each agent.yaml.
budgets: [25, 50, 100]

# Runtime. Kaggle reruns the whole submission end-to-end on the hidden set (about
# 120 tasks) and stops it with "Notebook Timeout" if it exceeds the total limit.
# max_time_minutes per task is CALCULATED from these numbers, never set by hand:
#   floor(total_hours * 60 * parallel_tasks / hidden_tasks * safety)
# Source: competition Overview > Evaluation: "Your agent has a limit of 12 hours to submit
# patches for all tasks, inclusive of sandbox setup time, but excluding time for patch validation."
runtime:
  total_hours: 12         # total limit for all tasks, including sandbox setup
  hidden_tasks: 120       # "about 120"; the hidden set can be larger, hence the safety margin
  parallel_tasks: 1       # 1 = tasks run one after another (worst case)
  safety: 0.7             # leave 30% for setup, model loading and a larger hidden set
  timeout_seconds: 60     # upper limit for one run_command call; the build uses a third of the task time if that is less
  extra_turns: 50         # max_turns = budget + extra_turns

# "Use a submission to verify basic fundamentals": the smallest possible agent.
# Its only goal is to finish and get any score. Submit it first.
smoke:
  arm: A
  budget: 3
  max_time_minutes: 1     # worst case 120 tasks x 1 min = 2 hours, so it finishes even under a short limit
  thinking_budget: 0

# NOTE for the paper (Section 3.2): with a few minutes per task the TIME limit ends a
# run long before 25, 50 or 100 calls are used, so b25/b50/b100 submissions behave
# almost the same. Leaderboard submissions measure the arms (A-D) under the real time
# limit; the budget curve must come from runs with enough time per task (for example
# your own notebook runs on the public tasks) or from truncating 100-call trajectories
# (localization only).
